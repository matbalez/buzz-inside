name: Notify Buzz when a pull request opens

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  notify-buzz:
    runs-on: ubuntu-latest
    steps:
      - name: Send pull request link to Buzz
        env:
          BUZZ_PR_WEBHOOK_SECRET: ${{ secrets.BUZZ_PR_WEBHOOK_SECRET }}
          BUZZ_PR_WEBHOOK_URL: ${{ vars.BUZZ_PR_WEBHOOK_URL }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          : "${BUZZ_PR_WEBHOOK_SECRET:?Missing BUZZ_PR_WEBHOOK_SECRET}"
          : "${BUZZ_PR_WEBHOOK_URL:?Missing BUZZ_PR_WEBHOOK_URL}"

          jq -n \
            --arg author "${PR_AUTHOR}" \
            --arg number "${PR_NUMBER}" \
            --arg url "${PR_URL}" \
            '{
              message: (
                "New GitHub pull request #" + $number
                + " opened by " + $author
                + " on matbalez/buzz-inside\n"
                + $url
              )
            }' > "${RUNNER_TEMP}/buzz-pr-notification.json"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Webhook-Secret: ${BUZZ_PR_WEBHOOK_SECRET}" \
            --data-binary "@${RUNNER_TEMP}/buzz-pr-notification.json" \
            "${BUZZ_PR_WEBHOOK_URL}"
