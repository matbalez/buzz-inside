name: Notify Mat about new pull requests

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  notify-buzz:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Mat to review the pull request
        env:
          BUZZ_PR_WEBHOOK_SECRET: ${{ secrets.BUZZ_PR_WEBHOOK_SECRET }}
          BUZZ_PR_WEBHOOK_URL: ${{ vars.BUZZ_PR_WEBHOOK_URL }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          : "${BUZZ_PR_WEBHOOK_SECRET:?Missing BUZZ_PR_WEBHOOK_SECRET}"
          : "${BUZZ_PR_WEBHOOK_URL:?Missing BUZZ_PR_WEBHOOK_URL}"
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]

          jq -n \
            --arg author "${PR_AUTHOR}" \
            --arg number "${PR_NUMBER}" \
            '{
              message: (
                "@Mat, a new pull request #" + $number
                + " was opened by " + $author + ":\n"
                + "https://github.com/matbalez/buzz-inside/pull/" + $number + "\n\n"
                + "Please take a look and tell me here what you would like to do."
              )
            }' > "${RUNNER_TEMP}/buzz-pr-notification.json"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Webhook-Secret: ${BUZZ_PR_WEBHOOK_SECRET}" \
            --data-binary "@${RUNNER_TEMP}/buzz-pr-notification.json" \
            "${BUZZ_PR_WEBHOOK_URL}"
